<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Shelf Barcode Finder</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Shelf Barcode Finder</h1>
        <p>Local camera scanning • iPhone + Android</p>
      </div>
      <span id="engineBadge" class="badge">Local decoder</span>
    </header>

    <section class="controls">
      <label class="target">
        <span>Last 4 digits</span>
        <input id="target" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="e.g. 9266" autocomplete="off">
      </label>
      <div class="buttons">
        <button id="startBtn" class="primary">Start camera</button>
        <button id="switchBtn">Switch camera</button>
        <button id="torchBtn" hidden>Flashlight</button>
      </div>
    </section>

    <section id="scanner" class="scanner" aria-label="Camera scanner">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <div class="scan-hud">
        <span id="status">Ready</span>
        <span id="count">0 found</span>
      </div>
    </section>

    <section class="match-panel">
      <div>
        <strong id="matchState">Waiting for scan</strong>
        <span id="matchValue">Enter the last 4 digits, then start the camera.</span>
      </div>
      <button id="clearBtn">Clear</button>
    </section>

    <section class="results">
      <div class="section-title"><h2>Detected barcodes</h2><span id="resultCount">0</span></div>
      <ul id="resultsList"></ul>
    </section>

    <p class="privacy">No barcode is uploaded to a server. Decoding happens in the browser. Camera access requires HTTPS (or localhost).</p>
  </main>

  <!-- ZXing is a local-in-the-browser barcode decoder. No barcode API/server is used. -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
